<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source of the app icon. ImageMagick 6 cannot render the gradient, so the PNGs
       are composed from gradient + rounded mask + glyph (see CLAUDE.md). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6a0f6"/>
      <stop offset="1" stop-color="#8aadf4"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <!-- Same glyph as the tray icon (64-unit grid, scaled 5x). -->
  <g transform="translate(96 92) scale(5)" fill="none" stroke="#181926" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="9" width="52" height="35" rx="5"/>
    <path d="M32 44v10M21 55h22"/>
    <path d="M32 36V19M24.5 26.5 32 19l7.5 7.5"/>
  </g>
</svg>
