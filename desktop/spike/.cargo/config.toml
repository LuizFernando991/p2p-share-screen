# libwebrtc (webrtc-sys) is built against Chromium's libc++ and needs clang >= 21
# (Ubuntu 24.04: install from apt.llvm.org).
[env]
CC = "clang-21"
CXX = "clang++-21"
# clang picks the newest GCC dir (14) for libstdc++ headers, but Ubuntu 24.04
# only ships them for GCC 13 (libstdc++-13-dev). Machine-specific; drop this
# if libstdc++-14-dev is installed.
CFLAGS = "--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13"
CXXFLAGS = "--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13"
