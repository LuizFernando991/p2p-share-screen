<!doctype html>
<html>
<body style="margin:0;background:#111;color:#eee;font:13px sans-serif">
<div style="display:flex;height:100vh">
  <div style="width:220px;padding:12px;background:#1e1f22">
    <b>Sala</b>
    <pre id="log" style="white-space:pre-wrap"></pre>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;background:#000">
    <canvas id="screen" style="max-width:100%;max-height:100%"></canvas>
  </div>
</div>
<script>
// Video arrives decoded (I420) from Rust over the frames:// protocol and is
// drawn with WebGL, converting YUV to RGB on the GPU.
const send = (kind, data) => window.ipc.postMessage(JSON.stringify({ kind, data }));
const log = (m) => { document.getElementById('log').textContent += m + '\n'; send('log', m); };
window.onerror = (msg) => send('error', String(msg));

const canvas = document.getElementById('screen');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true });
if (!gl) send('error', 'WebGL2 unavailable');

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, `#version 300 es
  out vec2 uv;
  void main() {
    // One triangle covering the viewport; texture row 0 is the top.
    vec2 p = vec2(float(gl_VertexID & 1), float(gl_VertexID >> 1)) * 2.0;
    uv = vec2(p.x, 1.0 - p.y);
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `#version 300 es
  precision mediump float;
  in vec2 uv;
  uniform sampler2D ty, tu, tv;
  out vec4 color;
  void main() {
    // BT.601 limited range, as produced by libwebrtc.
    float y = 1.1643 * (texture(ty, uv).r - 0.0625);
    float u = texture(tu, uv).r - 0.5;
    float v = texture(tv, uv).r - 0.5;
    color = vec4(y + 1.5958 * v, y - 0.39173 * u - 0.81290 * v, y + 2.017 * u, 1.0);
  }`));
gl.linkProgram(program);
gl.useProgram(program);
const textures = ['ty', 'tu', 'tv'].map((name, i) => {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + i);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(gl.getUniformLocation(program, name), i);
  return t;
});
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

let seq = 0, w = 0, h = 0, frames = 0, bytes = 0;
function upload(buf) {
  const dv = new DataView(buf);
  const fw = dv.getUint32(0, true), fh = dv.getUint32(4, true);
  seq = dv.getUint32(8, true);
  const cw = (fw + 1) >> 1, ch = (fh + 1) >> 1;
  const planes = [
    [fw, fh, new Uint8Array(buf, 12, fw * fh)],
    [cw, ch, new Uint8Array(buf, 12 + fw * fh, cw * ch)],
    [cw, ch, new Uint8Array(buf, 12 + fw * fh + cw * ch, cw * ch)],
  ];
  const resized = fw !== w || fh !== h;
  if (resized) { w = fw; h = fh; canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  planes.forEach(([pw, ph, data], i) => {
    gl.activeTexture(gl.TEXTURE0 + i);
    if (resized) gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, pw, ph, 0, gl.RED, gl.UNSIGNED_BYTE, data);
    else gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, pw, ph, gl.RED, gl.UNSIGNED_BYTE, data);
  });
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

async function pull() {
  for (;;) {
    const res = await fetch('/next?after=' + seq);
    const buf = await res.arrayBuffer();
    upload(buf);
    frames++;
    bytes += buf.byteLength;
  }
}

let seconds = 0;
setInterval(() => {
  seconds++;
  log(`${seconds}s: ${frames} fps, ${(bytes / 1e6).toFixed(0)} MB/s, ${w}x${h}`);
  frames = 0; bytes = 0;
  if (seconds === 8) {
    send('frame', canvas.toDataURL('image/png'));
    send('done', '');
  }
}, 1000);

log('waiting for the screen share...');
pull().catch((e) => send('error', String((e && e.stack) || e)));
</script>
</body>
</html>
