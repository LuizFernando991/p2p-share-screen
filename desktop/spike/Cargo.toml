[package]
name = "spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
livekit = { version = "0.9.5", features = ["tokio", "rustls-tls-native-roots", "glib-main-loop"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
