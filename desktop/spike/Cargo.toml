[package]
name = "spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
livekit = { version = "0.9.5", features = ["tokio", "rustls-tls-native-roots", "glib-main-loop"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
tokio = { version = "1.53.3", features = ["full"] }
wry = "0.57.0"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
